<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin ♡ luvselris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #faf7fd;
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary-purple: #c3a6ff;
      --deep-purple: #9d75ee;
      --soft-purple: #f3edff;
      --border-purple: #e5d8ff;
      --text-main: #3d3647;
      --text-muted: #887d96;
      --glow-shadow: 0 10px 30px rgba(195, 166, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #f6f0ff 0%, #faf7fd 60%, #f4edff 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding: 24px 16px 80px;
      display: flex;
      justify-content: center;
    }

    .floating-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      bottom: -60px;
      font-size: 24px;
      animation: floatUp 11s linear infinite;
      opacity: 0.75;
      filter: drop-shadow(0 2px 8px rgba(195, 166, 255, 0.3));
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 2;
    }

    /* LOGIN VIEW */
    #loginView {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 38px 24px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-purple);
      text-align: center;
    }

    .login-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--deep-purple);
      margin-bottom: 22px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      padding-left: 4px;
      font-weight: 600;
    }

    .input-field, .textarea-field {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-purple);
      border-radius: 18px;
      font-size: 14px;
      background: #fff;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }

    .input-field:focus, .textarea-field:focus {
      border-color: var(--deep-purple);
      box-shadow: 0 0 0 3px rgba(195, 166, 255, 0.25);
    }

    .btn-purple {
      width: 100%;
      background: linear-gradient(135deg, #d3bfff, var(--deep-purple));
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 20px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(195, 166, 255, 0.35);
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn-purple:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .error-text {
      color: #ff4d6d;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    /* DASHBOARD VIEW */
    #dashboardView {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 4px 6px;
    }

    .welcome-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--deep-purple);
    }

    .logout-btn {
      background: #fff;
      color: var(--deep-purple);
      border: 1.5px solid var(--border-purple);
      padding: 6px 16px;
      border-radius: 18px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: var(--soft-purple);
    }

    .panel-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 26px;
      padding: 22px 18px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-purple);
      margin-bottom: 20px;
    }

    .panel-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--deep-purple);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .upload-box {
      border: 1.5px dashed var(--border-purple);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      background: #faf7ff;
      margin-bottom: 14px;
    }

    .preview-banner {
      width: 100%;
      height: 110px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 10px;
      display: none;
      border: 2px solid #fff;
    }

    .preview-profile {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px;
      display: none;
      border: 3px solid var(--border-purple);
    }

    .file-btn {
      display: inline-block;
      background: linear-gradient(135deg, #d3bfff, var(--deep-purple));
      color: #fff;
      padding: 7px 18px;
      border-radius: 16px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(195, 166, 255, 0.3);
    }

    .post-box-admin {
      background: #ffffff;
      border: 1.5px solid var(--border-purple);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .preview-post-thumb {
      width: 100%;
      height: 120px;
      border-radius: 14px;
      object-fit: cover;
      margin-bottom: 10px;
      border: 1px solid var(--border-purple);
    }
  </style>
</head>
<body>

  <!-- Floating Icons: 👼🏻 ☁️ 🐰 🤍 🩹 -->
  <div class="floating-container" id="emojiBox"></div>

  <div class="container">

    <!-- LOGIN SCREEN -->
    <div id="loginView">
      <div class="login-card">
        <h1 class="login-title">Admin Login ♡</h1>
        
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>email</label>
            <input type="email" id="emailInput" class="input-field" placeholder="srezinalm@gmail.com" required>
          </div>

          <div class="form-group">
            <label>password</label>
            <input type="password" id="passwordInput" class="input-field" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-purple">เข้าสู่ระบบ ✨</button>
          <p id="loginError" class="error-text">อีเมลหรือรหัสผ่านไม่ถูกต้องค่ะ</p>
        </form>
      </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboardView">
      
      <div class="top-bar">
        <div class="welcome-text">welcome admin ♡</div>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
      </div>

      <!-- 1. ข้อมูลร้านและรูปภาพ -->
      <div class="panel-card">
        <div class="panel-title">🎀 ข้อมูลร้านและรูปภาพ</div>

        <div class="form-group">
          <label>เปลี่ยนรูปแบนเนอร์ GIF / ภาพปก (เลือกรูปจากเครื่อง)</label>
          <div class="upload-box">
            <img id="bannerPreview" class="preview-banner" alt="Banner Preview">
            <label class="file-btn">
              เลือกรูปแบนเนอร์
              <input type="file" accept="image/*" style="display: none;" onchange="handleImageFile(this, 'bannerPreview', 'banner')">
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>เปลี่ยนรูปโปรไฟล์ (เลือกรูปจากเครื่อง)</label>
          <div class="upload-box">
            <img id="profilePreview" class="preview-profile" alt="Profile Preview">
            <label class="file-btn">
              เลือกรูปโปรไฟล์
              <input type="file" accept="image/*" style="display: none;" onchange="handleImageFile(this, 'profilePreview', 'profile')">
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>ชื่อร้าน</label>
          <input type="text" id="storeNameInput" class="input-field" placeholder="luvselris ♡">
        </div>

        <div class="form-group">
          <label>คำอธิบายร้าน</label>
          <textarea id="storeBioInput" class="textarea-field" rows="3" placeholder="ข้อความแนะนำร้าน..."></textarea>
        </div>
      </div>

      <!-- 2. ลิงก์งาน 4 ลิงก์ -->
      <div class="panel-card">
        <div class="panel-title">✨ จัดการลิงก์งาน (4 ลิงก์)</div>
        <div id="linksFormContainer"></div>
      </div>

      <!-- 3. โพสต์เลื่อนได้ 4 โพสต์ -->
      <div class="panel-card">
        <div class="panel-title">🎀 จัดการโพสต์เลื่อนได้ (4 โพสต์)</div>
        <div id="postsFormContainer"></div>
      </div>

      <!-- 4. ลิงก์เพลงพื้นหลัง -->
      <div class="panel-card">
        <div class="panel-title">🎵 ลิงก์เพลงพื้นหลัง (Auto-play)</div>
        <div class="form-group">
          <label>ใส่ลิงก์ไฟล์เสียง (.mp3)</label>
          <input type="url" id="musicUrlInput" class="input-field" placeholder="https://files.catbox.moe/gqizpa.mp3">
        </div>
      </div>

      <!-- ปุ่มบันทึกขึ้น Cloud ให้ทุกคนเห็นพร้อมกัน -->
      <button type="button" class="btn-purple" id="saveAllBtn" style="font-size: 16px; padding: 15px; margin-top: 10px;" onclick="saveAllToCloud()">
        ☁️ บันทึกขึ้นระบบ (ให้ทุกคนเห็นพร้อมกัน) ♡
      </button>

    </div>

  </div>

  <script>
    const AUTH_EMAIL = "srezinalm@gmail.com";
    const AUTH_PASS = "@Natthanan2911";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Data State
    let currentData = {
      banner: "https://i.postimg.cc/26YfhPc1/CA378830-D049-4F10-B91D-83E369F619D9.gif",
      profile: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg",
      storeName: "luvselris ♡",
      storeBio: "ยินดีต้อนรับเข้าสู่ร้าน luvselris ♡ นะคะ\nเชิญเลือกดูก่อนได้เลยน้า ขอบคุณที่กดเข้ามาดูค้าบ",
      musicUrl: "https://files.catbox.moe/gqizpa.mp3",
      links: [
        { text: "link example ♡", url: "https://example.com/1" },
        { text: "link example ♡", url: "https://example.com/2" },
        { text: "link example ♡", url: "https://example.com/3" },
        { text: "link example ♡", url: "https://example.com/4" }
      ],
      posts: [
        { img: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg", title: "Post 01 ♡", desc: "รายละเอียดงานหรือข้อความโพสต์ที่ 1 แตะหรือเลื่อนดูได้เลยนะคะ" },
        { img: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg", title: "Post 02 ♡", desc: "รายละเอียดงานหรือข้อความโพสต์ที่ 2 แตะหรือเลื่อนดูได้เลยนะคะ" },
        { img: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg", title: "Post 03 ♡", desc: "รายละเอียดงานหรือข้อความโพสต์ที่ 3 แตะหรือเลื่อนดูได้เลยนะคะ" },
        { img: "https://i.ibb.co/gZg1bdv9/IMG-3203.jpg", title: "Post 04 ♡", desc: "รายละเอียดงานหรือข้อความโพสต์ที่ 4 แตะหรือเลื่อนดูได้เลยนะคะ" }
      ]
    };

    // ลูกเล่นลอย
    const icons = ['👼🏻', '☁️', '🐰', '🤍', '🩹'];
    const emojiContainer = document.getElementById('emojiBox');
    function createFloatingIcon() {
      const el = document.createElement('div');
      el.className = 'float-item';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 92 + 'vw';
      el.style.animationDuration = (8 + Math.random() * 5) + 's';
      emojiContainer.appendChild(el);
      setTimeout(() => { el.remove(); }, 14000);
    }
    setInterval(createFloatingIcon, 1200);

    // เช็กล็อกอิน
    window.onload = function() {
      if (sessionStorage.getItem('luvselris_admin_session') === 'true') {
        showDashboard();
      }
    };

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      const err = document.getElementById('loginError');

      if (email === AUTH_EMAIL && pass === AUTH_PASS) {
        sessionStorage.setItem('luvselris_admin_session', 'true');
        err.style.display = 'none';
        showDashboard();
      } else {
        err.style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('luvselris_admin_session');
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('loginView').style.display = 'flex';
    }

    async function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
      
      // ดึงข้อมูลล่าสุดจาก Cloud Firestore
      try {
        const doc = await db.collection("luvselris_site").doc("content").get();
        if (doc.exists) {
          currentData = { ...currentData, ...doc.data() };
        }
      } catch (err) {
        console.error("Firebase load error:", err);
      }

      renderDashboard();
    }

    function renderDashboard() {
      // โปรไฟล์ & แบนเนอร์
      if (currentData.banner) {
        const b = document.getElementById('bannerPreview');
        b.src = currentData.banner;
        b.style.display = 'block';
      }
      if (currentData.profile) {
        const p = document.getElementById('profilePreview');
        p.src = currentData.profile;
        p.style.display = 'block';
      }
      document.getElementById('storeNameInput').value = currentData.storeName || '';
      document.getElementById('storeBioInput').value = currentData.storeBio || '';
      document.getElementById('musicUrlInput').value = currentData.musicUrl || '';

      // ลิงก์ 4 ลิงก์
      const linksContainer = document.getElementById('linksFormContainer');
      linksContainer.innerHTML = '';
      currentData.links.forEach((link, idx) => {
        const box = document.createElement('div');
        box.className = 'form-group';
        box.style.background = '#faf7ff';
        box.style.padding = '12px';
        box.style.borderRadius = '16px';
        box.style.border = '1px solid var(--border-purple)';
        box.innerHTML = `
          <label>ชื่อลิงก์ที่ ${idx + 1}</label>
          <input type="text" id="linkText_${idx}" class="input-field" value="${link.text}" style="margin-bottom: 8px;">
          <label>URL ลิงก์ที่ ${idx + 1}</label>
          <input type="url" id="linkUrl_${idx}" class="input-field" value="${link.url}">
        `;
        linksContainer.appendChild(box);
      });

      // โพสต์ 4 โพสต์
      const postsContainer = document.getElementById('postsFormContainer');
      postsContainer.innerHTML = '';
      currentData.posts.forEach((post, idx) => {
        const box = document.createElement('div');
        box.className = 'post-box-admin';
        box.innerHTML = `
          <div style="font-weight: 700; color: var(--deep-purple); margin-bottom: 8px;">โพสต์ที่ ${idx + 1}</div>
          <img src="${post.img}" class="preview-post-thumb" id="postImgThumb_${idx}">
          <div style="margin-bottom: 10px;">
            <label class="file-btn" style="font-size: 11.5px; padding: 5px 12px;">
              เลือกรูปสำหรับโพสต์นี้
              <input type="file" accept="image/*" style="display: none;" onchange="handlePostFile(this, ${idx})">
            </label>
          </div>
          <div class="form-group">
            <label>หัวข้อโพสต์</label>
            <input type="text" id="postTitle_${idx}" class="input-field" value="${post.title}">
          </div>
          <div class="form-group">
            <label>คำอธิบายโพสต์</label>
            <textarea id="postDesc_${idx}" class="textarea-field" rows="2">${post.desc}</textarea>
          </div>
        `;
        postsContainer.appendChild(box);
      });
    }

    // อัปโหลดรูปภาพโดยตรงจากเครื่อง (ไม่ต้องแปลง URL)
    function handleImageFile(input, previewId, fieldKey) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          currentData[fieldKey] = e.target.result;
          const imgElem = document.getElementById(previewId);
          imgElem.src = e.target.result;
          imgElem.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    function handlePostFile(input, postIndex) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          currentData.posts[postIndex].img = e.target.result;
          document.getElementById(`postImgThumb_${postIndex}`).src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    // บันทึกข้อมูลขึ้น Cloud Firestore ทุกคนจะเห็นอัปเดตทันที
    async function saveAllToCloud() {
      const btn = document.getElementById('saveAllBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึกขึ้น Cloud... ⏳';

      currentData.storeName = document.getElementById('storeNameInput').value;
      currentData.storeBio = document.getElementById('storeBioInput').value;
      currentData.musicUrl = document.getElementById('musicUrlInput').value.trim();

      for (let i = 0; i < 4; i++) {
        currentData.links[i] = {
          text: document.getElementById(`linkText_${i}`).value || "link example ♡",
          url: document.getElementById(`linkUrl_${i}`).value || "#"
        };

        currentData.posts[i].title = document.getElementById(`postTitle_${i}`).value || `Post 0${i + 1} ♡`;
        currentData.posts[i].desc = document.getElementById(`postDesc_${i}`).value || "";
      }

      try {
        await db.collection("luvselris_site").doc("content").set(currentData);
        alert('✨ บันทึกข้อมูลขึ้นระบบสำเร็จแล้วค่ะ! ตอนนี้ทุกคนที่เข้าเว็บจะเห็นข้อมูลใหม่ทันที ♡');
      } catch (err) {
        console.error("Save error:", err);
        alert('เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่อีกครั้งค่ะ');
      } finally {
        btn.disabled = false;
        btn.textContent = '☁️️ บันทึกขึ้นระบบ (ให้ทุกคนเห็นพร้อมกัน) ♡';
      }
    }
  </script>
</body>
</html>
