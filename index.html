<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>luvselris ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #faf7fd;
      --card-bg: rgba(255, 255, 255, 0.94);
      --primary-purple: #c3a6ff;
      --deep-purple: #9d75ee;
      --soft-purple: #f3edff;
      --border-purple: #e5d8ff;
      --text-main: #3d3647;
      --text-muted: #887d96;
      --glow-shadow: 0 10px 30px rgba(195, 166, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #f6f0ff 0%, #faf7fd 60%, #f4edff 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Emojis: 👼🏻 ☁️ 🐰 🤍 🩹 */
    .floating-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      bottom: -60px;
      font-size: 24px;
      animation: floatUp 11s linear infinite;
      opacity: 0.75;
      filter: drop-shadow(0 2px 8px rgba(195, 166, 255, 0.3));
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 80px;
      position: relative;
      z-index: 2;
    }

    /* Header Profile & Banner */
    .header-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 16px 16px 26px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-purple);
      text-align: center;
      margin-bottom: 20px;
    }

    .banner-img {
      width: 100%;
      height: 145px;
      border-radius: 24px;
      object-fit: cover;
      margin-bottom: -50px;
      border: 2px solid #fff;
      box-shadow: 0 4px 14px rgba(195, 166, 255, 0.22);
    }

    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 6px 18px rgba(195, 166, 255, 0.3);
      position: relative;
      z-index: 2;
      background: #fff;
    }

    .store-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--deep-purple);
      margin-top: 12px;
      letter-spacing: 0.5px;
    }

    .store-bio {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.65;
      white-space: pre-line;
      padding: 0 10px;
    }

    /* Links Section */
    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 22px 18px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-purple);
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--deep-purple);
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .work-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: #ffffff;
      border-radius: 22px;
      border: 1.5px solid var(--border-purple);
      text-decoration: none;
      color: var(--text-main);
      font-size: 14.5px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(195, 166, 255, 0.1);
      transition: all 0.25s ease;
    }

    .work-link:hover {
      transform: translateY(-2px);
      background: #faf7ff;
      border-color: var(--primary-purple);
      box-shadow: 0 6px 18px rgba(195, 166, 255, 0.25);
    }

    .link-icon-arrow {
      color: var(--deep-purple);
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.2s;
    }

    .work-link:hover .link-icon-arrow {
      transform: translateX(4px);
    }

    /* Posts Carousel (4 Posts) */
    .posts-scroll-container {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 4px 4px 14px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .posts-scroll-container::-webkit-scrollbar {
      height: 6px;
    }

    .posts-scroll-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .posts-scroll-container::-webkit-scrollbar-thumb {
      background: var(--border-purple);
      border-radius: 10px;
    }

    .post-card {
      flex: 0 0 240px;
      background: #ffffff;
      border: 1.5px solid var(--border-purple);
      border-radius: 22px;
      overflow: hidden;
      scroll-snap-align: start;
      box-shadow: 0 6px 16px rgba(195, 166, 255, 0.12);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .post-card:hover {
      transform: translateY(-3px);
    }

    .post-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #f7f2ff;
    }

    .post-body {
      padding: 12px 14px;
    }

    .post-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--deep-purple);
      margin-bottom: 4px;
    }

    .post-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Floating Emojis -->
  <div class="floating-container" id="emojiContainer"></div>

  <!-- Music Auto-play -->
  <audio id="bgMusic" loop autoplay playsinline src="https://files.catbox.moe/gqizpa.mp3"></audio>

  <div class="container">
    
    <!-- Profile & Banner -->
    <div class="header-card">
      <img id="mainBanner" src="https://i.postimg.cc/26YfhPc1/CA378830-D049-4F10-B91D-83E369F619D9.gif" alt="Banner GIF" class="banner-img">
      <img id="mainProfile" src="https://i.ibb.co/gZg1bdv9/IMG-3203.jpg" alt="Profile" class="profile-img">
      
      <h1 class="store-name" id="mainStoreName">luvselris ♡</h1>
      <p class="store-bio" id="mainStoreBio">ยินดีต้อนรับเข้าสู่ร้าน luvselris ♡ นะคะ
เชิญเลือกดูก่อนได้เลยน้า ขอบคุณที่กดเข้ามาดูค้าบ</p>
    </div>

    <!-- 4 Work Links -->
    <div class="section-card">
      <div class="section-title">✨ Works & Links ♡</div>
      <div class="links-list" id="mainLinksContainer">
        <!-- โหลดจาก Firebase -->
      </div>
    </div>

    <!-- 4 Posts Carousel -->
    <div class="section-card">
      <div class="section-title">🎀 Recent Posts (เลื่อนดูได้นะคะ)</div>
      <div class="posts-scroll-container" id="mainPostsContainer">
        <!-- โหลดจาก Firebase -->
      </div>
    </div>

    <div class="footer-note">thank you for supporting luvselris ♡</div>
  </div>

  <script>
    // Firebase Config (เชื่อมต่อ Cloud Firestore เพื่อให้ทุกคนเห็นตรงกัน)
    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ฟังการเปลี่ยนแปลงข้อมูลร้านแบบ Real-time (ทุกคนเห็นข้อมูลเดียวกันทันทีที่แอดมินเซฟ)
     // -------------------------------------------------------------
    // ระบบแสดงข้อมูลและดึงแคชทันที ไม่ให้หน้าเว็บว่างเปล่า
    // -------------------------------------------------------------
    function renderSiteData(data) {
      if (!data) return;

      if (data.banner) document.getElementById('mainBanner').src = data.banner;
      if (data.profile) document.getElementById('mainProfile').src = data.profile;
      if (data.storeName) document.getElementById('mainStoreName').textContent = data.storeName;
      if (data.storeBio) document.getElementById('mainStoreBio').textContent = data.storeBio;

      // แสดงลิงก์งาน 4 ลิงก์
      if (data.links && data.links.length > 0) {
        const linksContainer = document.getElementById('mainLinksContainer');
        linksContainer.innerHTML = '';
        data.links.forEach(item => {
          const a = document.createElement('a');
          a.href = item.url || "#";
          a.target = "_blank";
          a.className = "work-link";
          a.innerHTML = `<span>${item.text || 'link example ♡'}</span><span class="link-icon-arrow">➔</span>`;
          linksContainer.appendChild(a);
        });
      }

      // แสดงโพสต์ 4 โพสต์
      if (data.posts && data.posts.length > 0) {
        const postsContainer = document.getElementById('mainPostsContainer');
        postsContainer.innerHTML = '';
        data.posts.forEach(post => {
          const div = document.createElement('div');
          div.className = "post-card";
          div.innerHTML = `
            <img src="${post.img || 'https://i.ibb.co/gZg1bdv9/IMG-3203.jpg'}" alt="${post.title}" class="post-img">
            <div class="post-body">
              <h3 class="post-title">${post.title || ''}</h3>
              <p class="post-desc">${post.desc || ''}</p>
            </div>
          `;
          postsContainer.appendChild(div);
        });
      }

      // เพลง
      if (data.musicUrl) {
        const music = document.getElementById('bgMusic');
        if (music.src !== data.musicUrl) {
          music.src = data.musicUrl;
          music.play().catch(() => {});
        }
      }
    }

    // 1. โหลดข้อมูลเดิมที่จำไว้มาแสดงทันทีในเสี้ยววินาทีแรก (ไม่กระตุก)
    const cachedData = localStorage.getItem('luvselris_cached_content');
    if (cachedData) {
      try {
        renderSiteData(JSON.parse(cachedData));
      } catch (e) {}
    }

    // 2. ดึงข้อมูลอัปเดตล่าสุดจาก Firebase
    db.collection("luvselris_site").doc("content").onSnapshot(doc => {
      if (doc.exists) {
        const liveData = doc.data();
        localStorage.setItem('luvselris_cached_content', JSON.stringify(liveData));
        renderSiteData(liveData);
      }
    });
